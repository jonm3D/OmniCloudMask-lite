[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicloudmask-lite"
version = "0.1.0"
description = "Pinned OmniCloudMask v4 array inference runtime for multimethod-sdb"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  {name = "Nick Wright", email = "nicholas.wright@dpird.wa.gov.au"},
  {name = "multimethod-sdb maintainers"},
]
dependencies = [
  "numpy>=2.0",
  "safetensors>=0.5",
  "segmentation-models-pytorch>=0.5",
  "timm>=1.0",
  "torch>=2.6",
]

[project.scripts]
omnicloudmask-lite = "omnicloudmask_lite.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools]
packages = ["omnicloudmask_lite"]

[tool.setuptools.package-data]
omnicloudmask_lite = ["model_manifest.json"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
